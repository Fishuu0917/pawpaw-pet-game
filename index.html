<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="description" content="領養一位宇宙夥伴，開始 PawPaw 的療癒日常。">
  <title>PawPaw 宇宙寵物店</title>
  <style>
    :root{font-family:"Nunito","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#433b51;background:#fff8ee;font-synthesis:none;--ink:#433b51;--muted:#877d91;--pink:#ff8eaa;--purple:#8d78d7;--yellow:#ffd66d;--mint:#a7dfc6;--card:#fffdf9;--line:#f1e7df;--shadow:0 14px 36px #60466b12}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 8%,#ffe4e9 0,transparent 25rem),radial-gradient(ellipse at 92% 26%,#e9e4ff 0,transparent 28rem),#fff8ee;color:var(--ink)}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #6350bd;outline-offset:3px}button:disabled{opacity:.48;cursor:not-allowed;transform:none!important}
    .shell{max-width:1100px;margin:auto;padding:22px 24px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:49px;height:49px;border-radius:17px;background:#fff;box-shadow:var(--shadow);font-size:27px}.brand h1{margin:0;font-size:20px;letter-spacing:.04em}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px #60466b08}.pill:hover{transform:translateY(-1px);background:#fff9fc}
    .game-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(310px,.9fr);gap:18px}.card{background:#ffffffd9;border:1px solid #fff;box-shadow:var(--shadow);border-radius:27px}.hero{position:relative;min-height:414px;padding:25px;overflow:hidden;background:linear-gradient(145deg,#fffdf8 10%,#fff0f3 57%,#f1edff)}.hero:before,.hero:after{content:"✦";position:absolute;color:#efc96a;font-size:22px;animation:twinkle 3s ease-in-out infinite}.hero:before{top:63px;left:11%}.hero:after{right:12%;top:102px;animation-delay:1s}.hero-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:start}.eyebrow{margin:0;color:#9b8ba4;font-size:11px;font-weight:900;letter-spacing:.16em}.pet-name{margin:4px 0 0;font-size:26px}.level-chip{background:#fff;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:900;box-shadow:0 4px 10px #60466b0d}.scene{position:absolute;inset:102px 0 0;display:flex;align-items:center;justify-content:center}.planet{position:absolute;bottom:18px;width:min(68%,300px);height:103px;border-radius:50%;background:linear-gradient(180deg,#ded8ff,#c8bff4);box-shadow:inset 0 -9px #b7abea,0 12px 0 #b7abea}.planet:before{content:"";position:absolute;left:12%;top:24px;width:13px;height:7px;background:#b8afe8;border-radius:50%;box-shadow:174px 22px #b8afe8,84px 45px #b8afe8}.pet-sprite{position:relative;z-index:1;display:grid;place-items:center;width:175px;height:175px;border-radius:50%;font-size:110px;filter:drop-shadow(0 12px 8px #5a3e6b24);animation:bob 3s ease-in-out infinite;transition:transform .2s}.pet-sprite.react{animation:happy .55s ease}.speech{position:absolute;z-index:2;top:23px;left:50%;transform:translateX(-50%);width:max-content;max-width:82%;padding:11px 17px;background:#fff;border-radius:17px;box-shadow:0 8px 20px #60466b12;text-align:center;font-size:13px;font-weight:800}.speech:after{content:"";position:absolute;bottom:-7px;left:50%;border-width:8px 7px 0;border-style:solid;border-color:#fff transparent transparent;transform:translateX(-50%)}.status-line{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:68%;text-align:center;color:#fff;font-size:12px;font-weight:900;z-index:2}
    .side{display:grid;gap:18px;align-content:start}.growth{padding:20px 21px}.section-head{display:flex;justify-content:space-between;align-items:center}.section-head h2{margin:0;font-size:15px}.exp-caption{font-size:12px;font-weight:800;color:var(--muted)}.exp-track,.meter{height:12px;border-radius:99px;background:#f2edf2;overflow:hidden}.exp-track{margin-top:13px}.exp-fill{height:100%;width:0;background:linear-gradient(90deg,#ffb05c,#ff7fa7);border-radius:inherit;transition:width .5s}.exp-note{margin:8px 0 0;font-size:11px;color:var(--muted)}.stats{padding:19px 21px}.stats h2{margin:0 0 15px;font-size:15px}.stat{display:grid;grid-template-columns:27px 65px 1fr 38px;gap:8px;align-items:center;margin:13px 0}.stat-icon{font-size:18px}.stat-label{font-size:12px;font-weight:800}.meter{height:10px}.meter span{display:block;height:100%;border-radius:inherit;transition:width .4s}.hunger{background:#ffb66e}.mood{background:#ff85a8}.energy{background:#7bcbb0}.stat-value{text-align:right;font-size:11px;font-weight:900;color:#786f83}.actions{padding:19px 21px}.actions h2{margin:0 0 13px;font-size:15px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}.action:hover{transform:translateY(-2px);box-shadow:0 8px 15px #60466b10}.action:active{transform:scale(.97)}.action-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#fff0e7;font-size:20px}.action:nth-child(2) .action-icon{background:#f2edff}.action:nth-child(3) .action-icon{background:#fff0f4}.action:nth-child(4) .action-icon{background:#eaf8f1}.action strong{display:block;font-size:12px}.action small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.footer{display:flex;justify-content:center;gap:9px;margin-top:18px;color:#aaa0ad;font-size:11px}.toast-area{position:fixed;right:18px;top:18px;z-index:20;display:grid;gap:9px;width:min(340px,calc(100vw - 36px))}.toast{padding:13px 16px;border:1px solid #fff;border-radius:16px;background:#fff;box-shadow:0 12px 35px #48355722;animation:toast-in .25s ease;font-size:13px;font-weight:800}.toast.event{background:#fff7da}.toast.achievement{background:#f1edff}.toast.error{background:#fff0f1}.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#342b4566;backdrop-filter:blur(6px)}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:min(88vh,850px);overflow:auto;padding:25px;border-radius:26px;background:#fffdf9;box-shadow:0 25px 70px #28203c44}.modal-head{display:flex;align-items:start;justify-content:space-between;margin-bottom:18px}.modal h2{margin:0;font-size:22px}.modal-sub{margin:6px 0 0;color:var(--muted);font-size:13px}.close{border:0;background:#f6f1f3;border-radius:50%;width:36px;height:36px;font-size:19px;cursor:pointer}.pet-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pet-choice{padding:16px 11px;border:2px solid var(--line);border-radius:20px;background:#fff;text-align:center;cursor:pointer;transition:.18s}.pet-choice:hover{transform:translateY(-3px)}.pet-choice.selected{border-color:#a18be8;background:#f7f3ff;box-shadow:0 8px 22px #8d78d729}.choice-emoji{font-size:52px}.pet-choice h3{margin:5px 0;font-size:15px}.pet-choice p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.voice{margin-top:7px;color:#7964c2!important;font-weight:800}.modal-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.primary{border:0;border-radius:14px;padding:12px 19px;background:linear-gradient(100deg,#9b83df,#7d6ac8);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 7px 16px #806cc633}.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}.plain{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-weight:800;cursor:pointer}.achievement-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.badge{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff}.badge.locked{opacity:.57;filter:grayscale(.5)}.badge-icon{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:14px;background:#fff4d6;font-size:21px}.badge h3{margin:0;font-size:13px}.badge p{margin:4px 0 0;color:var(--muted);font-size:11px}.confirm-copy{line-height:1.7;color:#71677d}.hidden{display:none!important}
    @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes happy{25%{transform:translateY(-17px) rotate(-9deg) scale(1.08)}60%{transform:translateY(3px) rotate(7deg)}}@keyframes twinkle{50%{transform:scale(.65) rotate(30deg);opacity:.55}}@keyframes toast-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
    @media(max-width:760px){.shell{padding:15px 14px 28px}.topbar{margin-bottom:14px}.brand-mark{width:43px;height:43px}.brand h1{font-size:17px}.brand p{font-size:10px}.pill{padding:9px 11px;font-size:12px}.game-grid{grid-template-columns:1fr;gap:13px}.hero{min-height:340px;padding:20px}.scene{inset:92px 0 0}.pet-sprite{font-size:94px;width:150px;height:150px}.planet{height:82px;bottom:18px}.speech{top:15px;font-size:12px}.side{gap:13px}.growth,.stats,.actions{padding:17px}.footer{margin-top:14px}.modal{padding:20px}.pet-choices{grid-template-columns:1fr 1fr}}
    @media(max-width:380px){.shell{padding-inline:10px}.hero{min-height:315px}.pet-sprite{font-size:82px}.stat{grid-template-columns:24px 57px 1fr 32px;gap:6px}.action{padding:10px 8px;gap:7px}.action-icon{width:33px;height:33px;font-size:18px}.achievement-list{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
      .ad-action{grid-column:1/-1;background:linear-gradient(110deg,#fff5d9,#fff0ea);border-color:#f5dfaa}.ad-action .action-icon{background:#ffe8a6}.ad-action small{font-size:11px}.bonus-note{margin:8px 0 14px;color:#7964c2;font-size:11px;font-weight:800}</style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">🐾</div><div><h1>PawPaw 宇宙寵物店</h1><p>今天也和宇宙夥伴一起發光吧！</p></div></div><nav class="top-actions" aria-label="遊戲選單"><button class="pill" id="achievementsBtn">🏆 成就</button><button class="pill" id="restartBtn">↻ 重新開始</button></nav></header>
    <div id="gameView" class="game-grid hidden">
      <section class="card hero" aria-label="寵物互動畫面"><div class="hero-head"><div><p class="eyebrow">YOUR LITTLE UNIVERSE</p><h2 id="petName" class="pet-name"></h2></div><span id="levelChip" class="level-chip"></span></div><div class="scene"><div class="speech" id="speech" aria-live="polite"></div><div class="planet" aria-hidden="true"></div><div id="petSprite" class="pet-sprite" aria-label="寵物外觀"></div><div id="moodCaption" class="status-line"></div></div></section>
      <div class="side"><section class="card growth"><div class="section-head"><h2>✨ 成長旅程</h2><span id="expLabel" class="exp-caption"></span></div><div class="exp-track" role="progressbar" id="expBar" aria-label="升級經驗進度"><div id="expFill" class="exp-fill"></div></div><p id="expNote" class="exp-note"></p></section>
        <section class="card stats"><h2>💖 夥伴狀態</h2><div class="stat"><span class="stat-icon" aria-hidden="true">🍪</span><span class="stat-label">飽食度</span><div class="meter" role="progressbar" id="hungerBar" aria-label="飽食度"><span class="hunger"></span></div><span class="stat-value" id="hungerValue"></span></div><div class="stat"><span class="stat-icon" aria-hidden="true">💗</span><span class="stat-label">心情</span><div class="meter" role="progressbar" id="moodBar" aria-label="心情"><span class="mood"></span></div><span class="stat-value" id="moodValue"></span></div><div class="stat"><span class="stat-icon" aria-hidden="true">⚡</span><span class="stat-label">體力</span><div class="meter" role="progressbar" id="energyBar" aria-label="體力"><span class="energy"></span></div><span class="stat-value" id="energyValue"></span></div></section>
        <section class="card actions"><h2>🎮 照顧一下</h2><p class="bonus-note" id="bonusEnergyNote">影片加成體力：0</p><div class="action-grid"><button class="action" data-action="feed"><span class="action-icon">🍰</span><span><strong>餵食</strong><small id="feedHint">體力 -5 · 飽食度 +20 · EXP +5</small></span></button><button class="action" data-action="play"><span class="action-icon">🪁</span><span><strong>玩耍</strong><small id="playHint">體力 -15 · 飽食度 -10 · EXP +15</small></span></button><button class="action" data-action="pet"><span class="action-icon">🫶</span><span><strong>摸摸</strong><small id="petHint">體力 -3 · 飽食度不變 · EXP +3</small></span></button><button class="action" data-action="sleep"><span class="action-icon">🌙</span><span><strong>睡覺</strong><small id="sleepHint">體力 +25 · 飽食度 -5 · EXP +5 · 冷卻 3 分鐘</small></span></button><button class="action ad-action" id="adRewardBtn" type="button"><span class="action-icon">▶️</span><span><strong>看影片補充體力</strong><small id="adRewardHint">今日剩餘 3 次 · 80% +50 · 18% +75 · 2% +100</small></span></button></div></section></div>
    </div><p class="footer"><span>🌟 你的進度會自動保存在這台裝置</span><span>·</span><span>免登入，隨時來玩</span></p>
  </main>
  <div class="toast-area" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <section class="overlay" id="adoptionOverlay" role="dialog" aria-modal="true" aria-labelledby="adoptionTitle"><div class="modal"><div class="modal-head"><div><h2 id="adoptionTitle">選一位宇宙夥伴吧！</h2><p class="modal-sub">每位夥伴都有自己的小個性，挑一位帶回家。</p></div></div><div id="petChoices" class="pet-choices"></div><div class="modal-bottom"><span id="adoptionHint" class="modal-sub">選好喜歡的夥伴就能開始囉</span><button class="primary" id="adoptBtn" disabled>領養這位夥伴 ✨</button></div></div></section>
  <section class="overlay" id="achievementOverlay" role="dialog" aria-modal="true" aria-labelledby="achievementTitle"><div class="modal"><div class="modal-head"><div><h2 id="achievementTitle">🏆 宇宙成就</h2><p class="modal-sub">每一次照顧，都是閃亮的小旅程。</p></div><button class="close" data-close="achievementOverlay" aria-label="關閉成就視窗">×</button></div><div class="achievement-list" id="achievementList"></div></div></section>
  <section class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="modal" style="max-width:420px"><div class="modal-head"><div><h2 id="confirmTitle">要重新開始嗎？</h2><p class="confirm-copy">目前裝置上的寵物與遊戲進度會被清除，並回到領養畫面。</p></div></div><div class="modal-bottom"><button class="plain" id="cancelReset">再想一下</button><button class="primary" id="confirmReset">確認重新開始</button></div></div></section>
  <script>
  (()=>{
    'use strict';
    const SAVE_KEY='pawpaw-save', VERSION=5, AD_DAILY_LIMIT=3, ACTION_COOLDOWN_MS=3*60*1000;
    const adVideos=['https://www.youtube.com/watch?v=Y1Lah0BM0KQ','https://www.youtube.com/watch?v=V1Lr-_AxeR8','https://www.youtube.com/watch?v=a2grcJdfXmY'];
    const pets=[
      {id:'cosmic_cat',name:'星星貓',emoji:'🐱',personality:'好奇心滿滿，最愛追逐流星。',lines:['喵～今天也要閃閃發光！','我看到一顆星星在眨眼！','呼嚕呼嚕，這裡好舒服。']},
      {id:'moon_dog',name:'月亮狗',emoji:'🐶',personality:'忠心又熱情，最喜歡陪伴你。',lines:['汪！你來了我超開心！','我們一起去探險吧！','嘿嘿，陪在你身邊最棒了。']},
      {id:'puff_hamster',name:'棉花倉鼠',emoji:'🐹',personality:'軟綿綿的小吃貨，口袋總有零食。',lines:['有沒有藏著小點心呀？','我把幸福塞進頰囊裡了！','咕嘰咕嘰，今天也好滿足。']},
      {id:'comet_rabbit',name:'彗星兔',emoji:'🐰',personality:'安靜又溫柔，耳朵會接收宇宙訊號。',lines:['嘘，我聽見星星唱歌了。','靠近一點，我分你一片月光。','蹦蹦～今天的宇宙很溫柔。']}
    ];
    const achievements=[
      {id:'first_action',name:'初次相遇',desc:'完成任一有效互動',icon:'🌱',test:p=>p.counters.successfulActions>=1},
      {id:'snack_friend',name:'點心好朋友',desc:'累計餵食 5 次',icon:'🍪',test:p=>p.counters.feed>=5},
      {id:'playful_star',name:'宇宙玩咖',desc:'累計玩耍 5 次',icon:'🪁',test:p=>p.counters.play>=5},
      {id:'gentle_hand',name:'摸摸專家',desc:'累計摸摸 10 次',icon:'🫶',test:p=>p.counters.pet>=10},
      {id:'dream_traveler',name:'夢境旅人',desc:'累計睡覺 5 次',icon:'🌙',test:p=>p.counters.sleep>=5},
      {id:'level_three',name:'閃亮新星',desc:'達到等級 3',icon:'⭐',test:p=>p.level>=3},
      {id:'event_collector',name:'宇宙奇遇家',desc:'累計觸發 5 次隨機事件',icon:'🔭',test:p=>p.counters.randomEvents>=5}
    ];
    const eventPool=[
      {name:'撿到星星糖',message:'你撿到一顆星星糖！牠開心得轉了一圈。',apply:p=>{p.mood+=10}},
      {name:'發現宇宙零食',message:'宇宙口袋裡冒出一包零食！',apply:p=>{p.hunger+=10}},
      {name:'追逐流星',message:'牠追著流星跑了一小段路。',apply:p=>{p.mood+=5;spendEnergy(p,5)}},
      {name:'發現柔軟小毯',message:'牠找到一條超柔軟的小毯子。',apply:p=>{p.energy+=10}}
    ];
    const $=s=>document.querySelector(s), clamp=n=>Math.max(0,Math.min(100,Math.round(n))), expNeeded=level=>100+(level-1)*50;
    function spendEnergy(p,amount){const fromNormal=Math.min(p.stats.energy,amount);p.stats.energy-=fromNormal;const remaining=amount-fromNormal,fromBonus=Math.min(p.bonusEnergy,remaining);p.bonusEnergy-=fromBonus;return{normal:fromNormal,bonus:fromBonus}}
    let save=null, selected=null, memoryOnly=false, previousFocus=null, lastReaction=null;
    function localDateKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function newSave(pet){const now=new Date().toISOString();return{schemaVersion:VERSION,createdAt:now,updatedAt:now,adCooldownUntil:0,sleepCooldownUntil:0,adUsage:{date:localDateKey(),count:0},pet:{id:pet.id,name:pet.name,level:1,exp:0,bonusEnergy:0,stats:{hunger:70,mood:70,energy:70},counters:{feed:0,play:0,pet:0,sleep:0,successfulActions:0,randomEvents:0}},achievements:{unlockedIds:[]}}}
    function validSave(x){const p=x?.pet,s=p?.stats,c=p?.counters,version=x?.schemaVersion;const legacyDailyValid=version===1||(version>=2&&version<=4&&x.dailyProgress&&/^\d{4}-\d{2}-\d{2}$/.test(x.dailyProgress.date)&&Number.isInteger(x.dailyProgress.earnedExp)&&x.dailyProgress.earnedExp>=0&&x.dailyProgress.earnedExp<=100);const cooldownValid=version<3||(Number.isSafeInteger(x?.adCooldownUntil)&&x.adCooldownUntil>=0);const bonusValid=version<4||(Number.isInteger(p?.bonusEnergy)&&p.bonusEnergy>=0);const newFieldsValid=version<5||(Number.isSafeInteger(x?.sleepCooldownUntil)&&x.sleepCooldownUntil>=0&&x.adUsage&&/^\d{4}-\d{2}-\d{2}$/.test(x.adUsage.date)&&Number.isInteger(x.adUsage.count)&&x.adUsage.count>=0&&x.adUsage.count<=AD_DAILY_LIMIT);return x&&[1,2,3,4,VERSION].includes(version)&&(version===VERSION?newFieldsValid:legacyDailyValid)&&cooldownValid&&bonusValid&&typeof x.createdAt==='string'&&typeof x.updatedAt==='string'&&pets.some(a=>a.id===p?.id)&&typeof p.name==='string'&&Number.isInteger(p.level)&&p.level>=1&&Number.isInteger(p.exp)&&p.exp>=0&&p.exp<expNeeded(p.level)&&['hunger','mood','energy'].every(k=>Number.isInteger(s?.[k])&&s[k]>=0&&s[k]<=100)&&['feed','play','pet','sleep','successfulActions','randomEvents'].every(k=>Number.isInteger(c?.[k])&&c[k]>=0)&&Array.isArray(x.achievements?.unlockedIds)}
    function persist(){if(!save)return;save.updatedAt=new Date().toISOString();if(memoryOnly)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){memoryOnly=true;toast('瀏覽器無法保存進度；本次仍可繼續遊玩。','error')}}
    function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const parsed=JSON.parse(raw);if(!validSave(parsed)){toast('找不到可讀取的遊戲存檔，請重新領養一位夥伴。','error');return null}const oldVersion=parsed.schemaVersion;const shouldMigrate=oldVersion<VERSION;parsed.schemaVersion=VERSION;if(oldVersion<3)parsed.adCooldownUntil=0;if(oldVersion<4)parsed.pet.bonusEnergy=0;if(oldVersion<5){parsed.sleepCooldownUntil=0;parsed.adUsage={date:localDateKey(),count:0};delete parsed.dailyProgress}else if(parsed.adUsage.date!==localDateKey())parsed.adUsage={date:localDateKey(),count:0};parsed.achievements.unlockedIds=parsed.achievements.unlockedIds.filter((id,i,a)=>achievements.some(x=>x.id===id)&&a.indexOf(id)===i);if(shouldMigrate){save=parsed;persist()}return parsed}catch(e){toast('讀取存檔失敗，這次仍可重新領養並遊玩。','error');memoryOnly=true;return null}}
    function toast(message,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),4300)}
    function showOverlay(id){previousFocus=document.activeElement;$(id).classList.add('show');const first=$(id).querySelector('button:not(:disabled)');if(first)first.focus()}
    function hideOverlay(id){$(id).classList.remove('show');if(previousFocus?.isConnected)previousFocus.focus()}
    function renderChoices(){const box=$('#petChoices');box.innerHTML='';pets.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='pet-choice'+(selected===p.id?' selected':'');b.setAttribute('aria-pressed',selected===p.id?'true':'false');b.innerHTML=`<div class="choice-emoji" aria-hidden="true">${p.emoji}</div><h3>${p.name}</h3><p>${p.personality}</p><p class="voice">「${p.lines[0]}」</p>`;b.addEventListener('click',()=>{selected=p.id;renderChoices();$('#adoptBtn').disabled=false});box.append(b)})}
    function petData(){return pets.find(p=>p.id===save.pet.id)}
    function formatRemaining(ms){const seconds=Math.ceil(Math.max(0,ms)/1000),minutes=String(Math.floor(seconds/60)).padStart(2,'0'),remainder=String(seconds%60).padStart(2,'0');return`${minutes}:${remainder}`}
    function render(){if(!save){$('#gameView').classList.add('hidden');showOverlay('#adoptionOverlay');renderChoices();return}if(save.adUsage.date!==localDateKey()){save.adUsage={date:localDateKey(),count:0};persist()}$('#adoptionOverlay').classList.remove('show');$('#gameView').classList.remove('hidden');const p=save.pet,def=petData(),need=expNeeded(p.level);$('#petName').textContent=p.name;$('#levelChip').textContent=`Lv. ${p.level} ✨`;
      const sprite=$('#petSprite');sprite.textContent=def.emoji;sprite.setAttribute('aria-label',p.name);$('#speech').textContent=lastReaction||def.lines[(p.counters.successfulActions)%def.lines.length];$('#moodCaption').textContent=p.stats.mood>=70?'今天也閃閃發光 ✨':p.stats.energy<20?'有點累了，休息一下吧':p.stats.hunger<25?'肚子咕嚕咕嚕叫了':'正在宇宙裡陪著你';
      $('#expLabel').textContent=`${p.exp} / ${need} EXP`;$('#expFill').style.width=`${p.exp/need*100}%`;$('#expBar').setAttribute('aria-valuenow',p.exp);$('#expBar').setAttribute('aria-valuemax',need);$('#expNote').textContent=`再獲得 ${need-p.exp} EXP 就能升級`;
      for(const k of ['hunger','mood','energy']){$(`#${k}Value`).textContent=`${p.stats[k]}%`;const bar=$(`#${k}Bar`);bar.querySelector('span').style.width=`${p.stats[k]}%`;bar.setAttribute('aria-valuenow',p.stats[k]);bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100')}
      $('#bonusEnergyNote').textContent=p.bonusEnergy>0?`影片加成體力：+${p.bonusEnergy} · 一般體力不足時補足其他消耗`:'影片加成體力：0';const availableEnergy=p.stats.energy+p.bonusEnergy,playButton=document.querySelector('[data-action="play"]'),canPlay=availableEnergy>=15;playButton.disabled=!canPlay;$('#playHint').textContent=!canPlay?'體力不足 15':p.stats.energy<15?'體力 -15 · 飽食 -10 · EXP +15 · 加成體力補差額':'體力 -15 · 飽食 -10 · EXP +15';const feedFull=p.stats.hunger>=100,feedButton=document.querySelector('[data-action="feed"]');feedButton.disabled=feedFull||availableEnergy<5;$('#feedHint').textContent=feedFull?'已經吃飽了':availableEnergy<5?'體力不足 5':p.stats.energy<5?'體力 -5 · 飽食 +20 · EXP +5 · 加成體力補差額':'體力 -5 · 飽食 +20 · EXP +5';const petButton=document.querySelector('[data-action="pet"]');petButton.disabled=availableEnergy<3;$('#petHint').textContent=availableEnergy<3?'體力不足 3':p.stats.energy<3?'體力 -3 · 飽食不變 · EXP +3 · 加成體力補差額':'體力 -3 · 飽食不變 · EXP +3';updateSleepButton();renderAchievements();refreshAdButton()}
    function renderAchievements(){const unlocked=save?.achievements?.unlockedIds||[];$('#achievementList').innerHTML=achievements.map(a=>{const yes=unlocked.includes(a.id);return`<article class="badge ${yes?'':'locked'}"><span class="badge-icon" aria-hidden="true">${yes?a.icon:'🔒'}</span><div><h3>${a.name} ${yes?'✓':''}</h3><p>${a.desc}</p></div></article>`}).join('')}
    function updateSleepButton(){const button=document.querySelector('[data-action="sleep"]');if(!button||!save)return;const remaining=Math.max(0,save.sleepCooldownUntil-Date.now());button.disabled=remaining>0;$('#sleepHint').textContent=remaining>0?`體力 +25 · 飽食度 -5 · EXP +5 · 冷卻中 ${formatRemaining(remaining)}`:'體力 +25 · 飽食度 -5 · EXP +5 · 冷卻 3 分鐘'}
    function refreshAdButton(){const button=$('#adRewardBtn');if(!button)return;if(save&&save.adUsage.date!==localDateKey()){save.adUsage={date:localDateKey(),count:0};persist()}const hint=$('#adRewardHint'),remaining=Math.max(0,(save?.adCooldownUntil??0)-Date.now()),usesLeft=Math.max(0,AD_DAILY_LIMIT-(save?.adUsage?.count??0));button.disabled=!save||remaining>0||usesLeft===0;if(remaining>0)hint.textContent=`冷卻中 ${formatRemaining(remaining)} · 今日剩餘 ${usesLeft} 次`;else if(usesLeft===0)hint.textContent='今日觀看已達 3 次 · 明日恢復';else hint.textContent=`今日剩餘 ${usesLeft} 次 · 80% +50 · 18% +75 · 2% +100`}
    function watchAdForEnergy(){if(!save)return;if(save.adUsage.date!==localDateKey())save.adUsage={date:localDateKey(),count:0};const now=Date.now(),usesLeft=AD_DAILY_LIMIT-save.adUsage.count;if(save.adCooldownUntil>now){toast(`影片獎勵還在冷卻中，${formatRemaining(save.adCooldownUntil-now)} 後再試。`,'error');refreshAdButton();return}if(usesLeft<=0){toast('今天的影片獎勵已達 3 次上限，明天會恢復。','error');refreshAdButton();return}const videoUrl=adVideos[Math.floor(Math.random()*adVideos.length)];let videoTab;try{videoTab=window.open(videoUrl,'_blank');if(videoTab)videoTab.opener=null}catch(e){videoTab=null}if(!videoTab){toast('瀏覽器擋下了新分頁，請允許此網站開啟分頁後再試。','error');return}const roll=Math.floor(Math.random()*100),reward=roll<80?50:roll<98?75:100;save.pet.bonusEnergy+=reward;save.adUsage.count++;save.adCooldownUntil=now+ACTION_COOLDOWN_MS;lastReaction=`影片已在新分頁開啟！抽中 +${reward} 點額外體力，一般體力不足時可補足照顧消耗 ⚡`;persist();render();toast(`影片已開啟！抽中 +${reward} 額外體力（加成儲備 ${save.pet.bonusEnergy}），今日還可觀看 ${AD_DAILY_LIMIT-save.adUsage.count} 次。`,'event')}
    function awardExp(amount){save.pet.exp+=amount;const levels=[];while(save.pet.exp>=expNeeded(save.pet.level)){save.pet.exp-=expNeeded(save.pet.level);save.pet.level++;save.pet.stats.mood=clamp(save.pet.stats.mood+10);save.pet.stats.energy=clamp(save.pet.stats.energy+10);levels.push(save.pet.level)}levels.forEach(level=>toast(`✨ 升級啦！${petData().name} 到達 Lv. ${level}，目前還有 ${save.pet.exp} EXP`,'event'));return amount}
    function unlockAchievements(){for(const a of achievements){if(!save.achievements.unlockedIds.includes(a.id)&&a.test(save.pet)){save.achievements.unlockedIds.push(a.id);toast(`🏆 成就解鎖：${a.name} — ${a.desc}`,'achievement')}}}
    function care(action){if(!save)return;const p=save.pet,s=p.stats;
      const energyCost={feed:5,play:15,pet:3,sleep:0}[action];if(action==='feed'&&s.hunger>=100){lastReaction='牠已經吃飽了，先陪牠玩耍或摸摸吧！';toast('寵物已經吃飽了，這次沒有消耗點心。','error');render();return}if(energyCost>0&&s.energy+p.bonusEnergy<energyCost){lastReaction='牠的體力不太夠了，先睡一覺或看影片補充體力吧。';toast(`${{feed:'餵食',play:'玩耍',pet:'摸摸'}[action]}需要至少 ${energyCost} 點可用體力。`,'error');render();return}if(action==='sleep'&&save.sleepCooldownUntil>Date.now()){toast(`睡覺還在冷卻中，${formatRemaining(save.sleepCooldownUntil-Date.now())} 後可以再次使用。`,'error');render();return}
      const energySpent=energyCost?spendEnergy(p,energyCost):{normal:0,bonus:0};const effects={feed:{hunger:20,mood:5,energy:0},play:{hunger:-10,mood:20,energy:0},pet:{hunger:0,mood:10,energy:0},sleep:{hunger:-5,mood:5,energy:25}}[action];for(const k of ['hunger','mood','energy'])s[k]=clamp(s[k]+effects[k]);p.counters[action]++;p.counters.successfulActions++;awardExp({feed:5,play:15,pet:3,sleep:5}[action]);
      let reaction={feed:'咬一口點心，幸福得瞇起眼睛！',play:'牠開心地追著玩具跑了一圈！',pet:'牠舒服地蹭蹭你的手，呼嚕呼嚕。',sleep:'牠伸個懶腰，充飽電醒來啦！'}[action];
      if(energySpent.bonus>0)reaction+=`（使用影片加成體力 ${energySpent.bonus} 點）`;let event=null;if(Math.floor(Math.random()*100)<15){event=eventPool[Math.floor(Math.random()*eventPool.length)];event.apply(p);for(const k of ['hunger','mood','energy'])s[k]=clamp(s[k]);if(event.name==='撿到星星糖')awardExp(5);p.counters.randomEvents++;reaction+=' '+event.message;toast(`🌠 ${event.name}！${event.message}`,'event')}
      if(action==='sleep')save.sleepCooldownUntil=Date.now()+ACTION_COOLDOWN_MS;
      lastReaction=reaction;$('#petSprite').classList.remove('react');void $('#petSprite').offsetWidth;$('#petSprite').classList.add('react');setTimeout(()=>$('#petSprite').classList.remove('react'),650);
      unlockAchievements();persist();render();if(action==='sleep')toast('睡覺完成！接下來 3 分鐘進入冷卻。','event')
    }
    document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>care(b.dataset.action)));
    $('#adRewardBtn').addEventListener('click',watchAdForEnergy);setInterval(()=>{refreshAdButton();updateSleepButton()},1000);
    $('#adoptBtn').addEventListener('click',()=>{if(!selected)return;save=newSave(pets.find(p=>p.id===selected));persist();toast(`歡迎 ${save.pet.name} 加入你的宇宙！`,'achievement');render();$('#achievementsBtn').focus()});
    $('#achievementsBtn').addEventListener('click',()=>{renderAchievements();showOverlay('#achievementOverlay')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>hideOverlay('#'+b.dataset.close)));
    $('#restartBtn').addEventListener('click',()=>{if(save)showOverlay('#confirmOverlay');else{selected=null;renderChoices();showOverlay('#adoptionOverlay')}});$('#cancelReset').addEventListener('click',()=>hideOverlay('#confirmOverlay'));$('#confirmReset').addEventListener('click',()=>{try{localStorage.removeItem(SAVE_KEY)}catch(e){memoryOnly=true}save=null;selected=null;hideOverlay('#confirmOverlay');render();toast('已清除進度，選一位新夥伴吧。')});
    document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o&&o.id!=='adoptionOverlay')hideOverlay('#'+o.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){const visible=document.querySelector('.overlay.show');if(visible&&visible.id!=='adoptionOverlay')hideOverlay('#'+visible.id)}});
    save=load();render();
  })();
  </script>
